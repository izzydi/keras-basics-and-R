name: R CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-and-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
      - name: Install pak
        run: |
          Rscript -e 'install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s", .Platform$pkgType, R.Version()$os, R.Version()$arch))'
      - name: Install pinned dependencies
        run: |
          Rscript -e 'refs <- c(readLines("R-packages.txt"), "knitr@1.52"); pak::pkg_install(refs, upgrade = FALSE)'
      - name: Extract and parse R code
        run: |
          Rscript -e 'knitr::purl("keras_autoencoder_pipeline.Rmd", output = tempfile(fileext = ".R"), quiet = TRUE) |> parse()'
