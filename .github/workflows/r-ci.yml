name: R CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-and-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true
      - name: Install declared dependencies
        run: |
          Rscript -e 'pkgs <- unique(c(readLines("R-packages.txt"), "knitr")); install.packages(pkgs, repos = "https://cloud.r-project.org")'
      - name: Extract and parse R code
        run: |
          Rscript -e 'knitr::purl("keras_autoencoder_pipeline.Rmd", output = tempfile(fileext = ".R"), quiet = TRUE) |> parse()'
